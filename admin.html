<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Wishes — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Shadows+Into+Light&family=Quicksand:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* admin-only extras on top of the shared theme */
    .admin-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 20px;
    }
    .wish-count { font-family: var(--hand); font-size: 26px; color: var(--ink); }
    .admin-actions { display: flex; gap: 14px; align-items: baseline; }
    .linkish {
      background: none;
      border: none;
      padding: 0;
      font-family: var(--body);
      font-size: 14px;
      color: rgba(122, 26, 31, 0.7);
      text-decoration: underline;
      cursor: pointer;
    }
    .wish { padding: 18px 20px; margin-bottom: 16px; }
    .wish-msg { font-family: var(--scribble); font-size: 19px; color: var(--ink-dark); margin: 0; overflow-wrap: anywhere; }
    .wish-meta { font-size: 13px; color: rgba(122, 26, 31, 0.65); margin: 10px 0 0; }
    .wish-meta .who { font-family: var(--hand); font-size: 19px; color: var(--ink); margin-right: 8px; }
    .state-note { text-align: center; font-family: var(--hand); font-size: 24px; color: var(--ink-soft); }
  </style>
</head>

<body>
  <main class="page">
    <section class="centered" style="margin-bottom:40px">
      <h1 class="hand section-title" style="margin-bottom:8px">Wishes 💌<span class="ar title-ar">رسائل المعازيم</span></h1>
    </section>

    <!-- key gate -->
    <section id="gate" class="centered" hidden>
      <form id="key-form" class="card pad-md note-form" style="max-width:380px;margin:0 auto">
        <p class="hand" style="font-size:24px;color:var(--ink);margin:0">Admin key</p>
        <input id="key-input" type="password" placeholder="paste the secret key" class="scribble field" />
        <button type="submit" class="btn wide">Open the mailbox</button>
      </form>
    </section>

    <!-- wishes list -->
    <section id="panel" hidden>
      <div class="admin-bar">
        <span class="wish-count" id="count">…</span>
        <span class="admin-actions">
          <button class="linkish" id="refresh">refresh</button>
          <button class="linkish" id="logout">forget key</button>
        </span>
      </div>
      <p class="state-note" id="state">Opening the mailbox…</p>
      <div id="list"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbx-yPIVaJyXrlGbcSzlg6k-VbQdBtaR2WUkJ917wE0NmGGb_XsO1jX2hjNb_I2Vg7CC/exec";
    const KEY_STORE = "wishes-admin-key";

    const gate = document.getElementById("gate");
    const panel = document.getElementById("panel");
    const state = document.getElementById("state");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function showToast(message) {
      const t = document.getElementById("toast");
      t.textContent = message;
      t.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.remove("show"), 3500);
    }

    function getKey() {
      try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; }
    }
    function setKey(v) {
      try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch {}
    }

    function show(which) {
      gate.hidden = which !== "gate";
      panel.hidden = which !== "panel";
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      return d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    }

    async function load() {
      show("panel");
      state.hidden = false;
      state.textContent = "Opening the mailbox…";
      list.innerHTML = "";
      count.textContent = "…";
      try {
        const res = await fetch(ENDPOINT + "?key=" + encodeURIComponent(getKey()));
        const data = await res.json();
        if (!data.ok) {
          setKey("");
          show("gate");
          showToast("That key didn't work 🔒");
          return;
        }
        count.textContent = data.wishes.length + (data.wishes.length === 1 ? " wish" : " wishes");
        if (!data.wishes.length) {
          state.textContent = "No wishes yet — share the invitation! 💌";
          return;
        }
        state.hidden = true;
        for (const w of data.wishes) {
          const card = document.createElement("div");
          card.className = "card wish";
          const msg = document.createElement("p");
          msg.className = "wish-msg";
          msg.textContent = w.message;
          const meta = document.createElement("p");
          meta.className = "wish-meta";
          const who = document.createElement("span");
          who.className = "who";
          who.textContent = w.name || "Anonymous";
          meta.appendChild(who);
          meta.appendChild(document.createTextNode(fmtDate(w.at)));
          card.appendChild(msg);
          card.appendChild(meta);
          list.appendChild(card);
        }
      } catch (err) {
        state.textContent = "Couldn't reach the mailbox — try refresh.";
        console.error(err);
      }
    }

    document.getElementById("key-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const v = document.getElementById("key-input").value.trim();
      if (!v) return;
      setKey(v);
      load();
    });
    document.getElementById("refresh").addEventListener("click", load);
    document.getElementById("logout").addEventListener("click", () => {
      setKey("");
      show("gate");
    });

    getKey() ? load() : show("gate");
  </script>
</body>

</html>
